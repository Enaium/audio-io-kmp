org.gradle.jvmargs=-Xmx4g
kotlin.code.style=official

# Every platform source set of :audio-io-kmp is wired by hand (a shared
# src/nativeMain, src/posixNativeMain, ... directory is compiled into each
# matching target), so the automatic hierarchy template is turned off to keep
# the source set graph explicit.
kotlin.mpp.applyDefaultHierarchyTemplate=false
# The JS toolchain keeps Yarn optional: every CI image and developer machine
# has npm, so the npm dependencies (the SDL and imgui Emscripten packages) are
# installed with it instead of downloading a Yarn build.
kotlin.js.yarn=false
