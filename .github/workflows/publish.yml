name: Publish

"on":
  workflow_dispatch:

# Publishes every artifact from the runner that can build it. Maven Central
# coordinates are immutable, so each publication is produced by exactly one
# runner:
#
#   macos-14      -> :audio-io-kmp metadata + jvm + macosArm64 + macosX64 klibs
#   ubuntu-latest -> :audio-io-kmp linuxX64 + linuxArm64 klibs
#   ubuntu-latest -> :audio-io-kmp mingwX64 klib (cross compiled with the
#                    Kotlin/Native MinGW sysroot, which provides the WASAPI
#                    headers and import libraries)
#   ubuntu-latest -> :audio-io-kmp android AAR + androidNative klibs
#
# The kotlinMultiplatform metadata module (published from macOS) redirects to
# the per-target klib modules, so all of them have to be published before
# consumers can resolve the artifact.
#
# Trigger: run manually via the Actions tab. The published version is the one
# in build.gradle.kts (allprojects.version).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal user-token password
#   SIGNING_KEY              base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID           8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD         Passphrase of the signing key

jobs:
  publish-macos:
    name: Publish macOS (metadata + jvm + Apple klibs)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish metadata, jvm and Apple klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :audio-io-kmp:publishKotlinMultiplatformPublicationToMavenCentralRepository
          :audio-io-kmp:publishJvmPublicationToMavenCentralRepository
          :audio-io-kmp:publishMacosArm64PublicationToMavenCentralRepository
          :audio-io-kmp:publishMacosX64PublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-linux:
    name: Publish Linux (linuxX64/linuxArm64 klibs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish the Linux klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :audio-io-kmp:publishLinuxX64PublicationToMavenCentralRepository
          :audio-io-kmp:publishLinuxArm64PublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-windows:
    name: Publish Windows (mingwX64 klib)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Builds the GUID archive that the wasapi klib embeds: the MinGW sysroot
      # Kotlin/Native downloads has no import library for the Core Audio ids.
      - name: Install the MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish the mingwX64 klib
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :audio-io-kmp:publishMingwX64PublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-android:
    name: Publish Android (AAR + androidNative klibs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android platform
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish the AAR and the androidNative klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :audio-io-kmp:publishAndroidPublicationToMavenCentralRepository
          :audio-io-kmp:publishAndroidNativeArm64PublicationToMavenCentralRepository
          :audio-io-kmp:publishAndroidNativeArm32PublicationToMavenCentralRepository
          :audio-io-kmp:publishAndroidNativeX64PublicationToMavenCentralRepository
          :audio-io-kmp:publishAndroidNativeX86PublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
