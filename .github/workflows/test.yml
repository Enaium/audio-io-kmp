name: Test

"on":
  workflow_dispatch:

# Builds and tests every platform on a runner that can build it:
#
#   macOS ARM64 -> jvm + macosArm64/macosX64 klibs, JVM tests, Core Audio tests,
#                  the spectrum visualizer example (JVM and macosArm64, headless)
#   Linux x64   -> linuxX64/linuxArm64 klibs, JVM tests, ALSA tests
#   Linux x64   -> mingwX64 klib (cross compiled with the Kotlin/Native MinGW
#                  sysroot, which also provides the WASAPI headers)
#   Linux x64   -> androidNative klibs (arm64/arm32/x64/x86), the Android AAR
#                  and the visualizer APK
#
# Every job publishes the artifacts of its platforms to the local Maven
# repository before running the tests, which exercises the publications and
# their signatures (the same repository secrets the publish workflow uses).
#
# Trigger: run manually from the Actions tab.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS ARM64
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the macOS klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          :audio-io-kmp:compileKotlinMacosArm64
          :audio-io-kmp:compileKotlinMacosX64

      # Publishing to the local Maven repository is part of the test: it
      # exercises every publication (metadata, sources, module, klib) the
      # release would produce, and the tests below then run against a module
      # that was packaged exactly once.
      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish the macOS artifacts to Maven Local
        run: >
          ./gradlew --no-daemon --rerun-tasks --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :audio-io-kmp:publishKotlinMultiplatformPublicationToMavenLocal
          :audio-io-kmp:publishJvmPublicationToMavenLocal
          :audio-io-kmp:publishMacosArm64PublicationToMavenLocal
          :audio-io-kmp:publishMacosX64PublicationToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :audio-io-kmp:jvmTest

      - name: Run Core Audio tests
        run: ./gradlew --no-daemon :audio-io-kmp:macosArm64Test

      - name: Run the visualizer example (JVM, headless)
        run: >
          ./gradlew --no-daemon :examples:audio-visualizer:jvmRun
          --args="--frames 60"

      - name: Run the visualizer example (macosArm64, headless)
        run: >
          AUDIO_VISUALIZER_FRAMES=60
          ./gradlew --no-daemon :examples:audio-visualizer:runDebugExecutableMacosArm64

  test-linux:
    name: Test Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The backend loads libasound at runtime, so the test binary only needs
      # the shared object to be present on the runner.
      - name: Install ALSA
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the Linux klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          :audio-io-kmp:compileKotlinLinuxX64
          :audio-io-kmp:compileKotlinLinuxArm64

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish the Linux artifacts to Maven Local
        run: >
          ./gradlew --no-daemon --rerun-tasks --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :audio-io-kmp:publishLinuxX64PublicationToMavenLocal
          :audio-io-kmp:publishLinuxArm64PublicationToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :audio-io-kmp:jvmTest

      - name: Run ALSA tests
        run: ./gradlew --no-daemon :audio-io-kmp:linuxX64Test

      - name: Run the visualizer example (JVM, headless)
        run: >
          ./gradlew --no-daemon :examples:audio-visualizer:jvmRun
          --args="--frames 60"

      - name: Run the visualizer example (linuxX64, headless)
        run: >
          AUDIO_VISUALIZER_FRAMES=60
          ./gradlew --no-daemon :examples:audio-visualizer:runDebugExecutableLinuxX64

  test-windows:
    name: Test Windows x64 (mingwX64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The WASAPI headers and import libraries come from the MinGW sysroot that
      # Kotlin/Native downloads itself. That sysroot carries no import library
      # for the Core Audio ids, so the cross compiler is installed here to build
      # the GUID archive the klib embeds (see the module's build script).
      - name: Install the MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish the mingwX64 artifact to Maven Local
        run: >
          ./gradlew --no-daemon --rerun-tasks --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :audio-io-kmp:publishMingwX64PublicationToMavenLocal

      - name: Build the mingwX64 klib and link its test binary
        run: >
          ./gradlew --no-daemon --stacktrace
          :audio-io-kmp:compileKotlinMingwX64
          :audio-io-kmp:linkDebugTestMingwX64

      - name: Verify the GUID archive is embedded
        # Consumers link against the klib, so the Core Audio GUIDs the sysroot
        # does not provide have to ride along in it (see wasapi_guids.c).
        run: |
          lib=$(find audio-io-kmp/build/classes/kotlin/mingwX64/main/cinterop -name libwasapi_guids.a | head -1)
          echo "=== $lib ==="
          if [ -z "$lib" ]; then
            echo "FAIL: no GUID archive in the wasapi cinterop"
            exit 1
          fi
          nm --defined-only "$lib" | sed -n '/CLSID_MMDeviceEnumerator/p;/IID_IAudioClient/p;/PKEY_Device_FriendlyName/p'
          echo "OK: $(du -h "$lib" | cut -f1)"

      - name: Run JVM tests
        run: ./gradlew --no-daemon :audio-io-kmp:jvmTest

  test-android:
    name: Test Android (androidNative + AAR)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android platform
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # AAudio is resolved at runtime, the sysroot stub libraries that the
      # Kotlin/Native Android targets link against ship with Kotlin/Native.
      - name: Build the androidNative klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          :audio-io-kmp:compileKotlinAndroidNativeArm64
          :audio-io-kmp:compileKotlinAndroidNativeArm32
          :audio-io-kmp:compileKotlinAndroidNativeX64
          :audio-io-kmp:compileKotlinAndroidNativeX86

      - name: Assemble the Android library
        run: ./gradlew --no-daemon :audio-io-kmp:assembleAndroidMain

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish the Android artifacts to Maven Local
        run: >
          ./gradlew --no-daemon --rerun-tasks --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :audio-io-kmp:publishAndroidPublicationToMavenLocal
          :audio-io-kmp:publishAndroidNativeArm64PublicationToMavenLocal
          :audio-io-kmp:publishAndroidNativeArm32PublicationToMavenLocal
          :audio-io-kmp:publishAndroidNativeX64PublicationToMavenLocal
          :audio-io-kmp:publishAndroidNativeX86PublicationToMavenLocal

      # The example builds libmain.so per ABI and packages it into the APK, so
      # this also verifies the four androidNative link tasks.
      - name: Assemble the visualizer APK
        run: ./gradlew --no-daemon :examples:audio-visualizer:android:assembleDebug
